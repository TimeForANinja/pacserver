# Sample Supervisor configuration for PAC-Server
#
# Copy this file to /etc/supervisor/conf.d/pacserver.conf (Debian/Ubuntu) or
# to /etc/supervisord.d/pacserver.ini (RHEL/CentOS/Alma) and adjust paths.
# Then run:
#   sudo supervisorctl reread
#   sudo supervisorctl update
#
# Expected layout on the host:
#   /opt/pacserver/            # project root
#   ├── start.sh               # provided in this repo
#   ├── requirements.txt
#   ├── demo_files/
#   └──                        # install dependencies as you prefer

[program:pacserver]
; Change this to where you cloned/deployed the repo
directory=/opt/pacserver

; Run via bash and execute the provided start script
command=/bin/bash -lc './start.sh'

; Set environment for the app here (edit as needed)
; Note: commas must be escaped as \, in supervisor's environment= lines
environment=
    APP_IP_MAP_FILE="/opt/pacserver/demo_files/zones.csv",
    APP_PAC_ROOT="/opt/pacserver/demo_files/pacs",
    APP_CONTACT_INFO="NOC Germany",
    APP_DO_AUTO_REFRESH="true",
    APP_MAX_CACHE_AGE="3600",
    APP_HOST="0.0.0.0",
    APP_PORT="8080",
    PROMETHEUS_MULTIPROC_DIR="/run/pacserver/metrics"

; Ensure the metrics directory exists before start
; Use a simple pre-start command to create it (requires supervisord >= 4.0)
; For older versions, create the directory via system boot scripts
redirect_stderr=true
stdout_logfile=/var/log/pacserver/pacserver.stdout.log
stderr_logfile=/var/log/pacserver/pacserver.stderr.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5

; Process control
stopsignal=TERM
stopwaitsecs=20
autorestart=true
autostart=true
startretries=3

; Security/context (adjust user/group if needed)
; user=pacserver
; group=pacserver
